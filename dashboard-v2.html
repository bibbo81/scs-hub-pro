<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Costi Trasporti - SCS Hub Pro</title>
    
    <!-- ✅ CSS LOCALI -->
    <link rel="stylesheet" href="../../../assets/css/global.css">
    <link rel="stylesheet" href="./dashboard-v2.css">
    
    <!-- ✅ FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- ✅ CHART.JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@2.29.3/index.min.js"></script>
</head>
<body>
    <!-- ✅ HEADER -->
    <div id="headerContainer"></div>

    <!-- ✅ MAIN DASHBOARD -->
    <div class="dashboard-container">
        
        <!-- 🔍 SEZIONE FILTRI -->
        <section class="filters-section">
            <div class="filters-grid">
                <div class="filter-group">
                    <label for="periodFilter">📅 Periodo</label>
                    <select id="periodFilter">
                        <option value="7">Ultimi 7 giorni</option>
                        <option value="30" selected>Ultimi 30 giorni</option>
                        <option value="90">Ultimi 3 mesi</option>
                        <option value="365">Ultimo anno</option>
                        <option value="custom">Personalizzato</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="carrierFilter">🚚 Corriere</label>
                    <select id="carrierFilter">
                        <option value="">Tutti i corrieri</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="routeFilter">🛣️ Rotta</label>
                    <select id="routeFilter">
                        <option value="">Tutte le rotte</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="costRangeFilter">💰 Range Costi</label>
                    <select id="costRangeFilter">
                        <option value="">Tutti i costi</option>
                        <option value="0-100">€0 - €100</option>
                        <option value="100-500">€100 - €500</option>
                        <option value="500-1000">€500 - €1.000</option>
                        <option value="1000+">€1.000+</option>
                    </select>
                </div>

                <div class="filter-actions">
                    <button class="btn-primary" id="applyFilters">
                        <i class="fas fa-search"></i> Applica
                    </button>
                    <button class="btn-secondary" id="resetFilters">
                        <i class="fas fa-undo"></i> Reset
                    </button>
                </div>
            </div>

            <!-- ✅ DATE PERSONALIZZATE -->
            <div id="customDateRange" style="display: none;">
                <input type="date" id="startDate">
                <input type="date" id="endDate">
            </div>
        </section>

        <!-- 📊 SEZIONE KPI -->
        <section class="kpi-section">
            <div class="kpi-grid" id="kpiGrid">
                <!-- ✅ KPI DINAMICI GENERATI DA JS -->
            </div>
        </section>

        <!-- 📈 SEZIONE CHARTS -->
        <section class="charts-section">
            <div class="charts-grid">
                <!-- ✅ TREND COSTI -->
                <div class="chart-card">
                    <div class="chart-header">
                        <h3><i class="fas fa-chart-line"></i> Trend Costi nel Tempo</h3>
                        <select id="trendPeriod">
                            <option value="daily">Giornaliero</option>
                            <option value="weekly" selected>Settimanale</option>
                            <option value="monthly">Mensile</option>
                        </select>
                    </div>
                    <canvas id="costsChart"></canvas>
                </div>

                <!-- ✅ DISTRIBUZIONE CORRIERI -->
                <div class="chart-card">
                    <div class="chart-header">
                        <h3><i class="fas fa-chart-pie"></i> Costi per Corriere</h3>
                        <select id="carrierMetric">
                            <option value="costs">Costi Totali</option>
                            <option value="avg_cost">Costo Medio</option>
                            <option value="volume">Volume Spedizioni</option>
                        </select>
                    </div>
                    <canvas id="carriersChart"></canvas>
                </div>

                <!-- ✅ ROTTE PIÙ COSTOSE -->
                <div class="chart-card">
                    <div class="chart-header">
                        <h3><i class="fas fa-route"></i> Rotte per Costo</h3>
                        <select id="routeMetric">
                            <option value="total_cost">Costo Totale</option>
                            <option value="avg_cost">Costo Medio</option>
                            <option value="cost_per_kg">Costo per Kg</option>
                        </select>
                    </div>
                    <canvas id="routesChart"></canvas>
                </div>

                <!-- ✅ TEMPI VS COSTI -->
                <div class="chart-card">
                    <div class="chart-header">
                        <h3><i class="fas fa-clock"></i> Tempi di Transito vs Costi</h3>
                        <select id="transitMetric">
                            <option value="scatter">Scatter Plot</option>
                            <option value="correlation">Correlazione</option>
                        </select>
                    </div>
                    <canvas id="transitChart"></canvas>
                </div>
            </div>
        </section>

        <!-- 🎯 SEZIONE ANALISI -->
        <section class="analysis-section">
            <div class="analysis-grid">
                
                <!-- ✅ TOP ROTTE COSTOSE -->
                <div class="analysis-card">
                    <h3><i class="fas fa-list-ol"></i> Top 10 Rotte Più Costose</h3>
                    <div id="topRoutes">
                        <!-- ✅ LISTA DINAMICA -->
                    </div>
                </div>

                <!-- ✅ PERFORMANCE CORRIERI -->
                <div class="analysis-card">
                    <h3><i class="fas fa-trophy"></i> Performance Corrieri</h3>
                    <div style="overflow-x: auto;">
                        <table class="performance-table">
                            <thead>
                                <tr>
                                    <th>Corriere</th>
                                    <th>Spedizioni</th>
                                    <th>Costo Totale</th>
                                    <th>Costo Medio</th>
                                    <th>Tempo Medio</th>
                                    <th>Efficienza</th>
                                </tr>
                            </thead>
                            <tbody id="carriersPerformance">
                                <!-- ✅ DATI DINAMICI -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- ✅ BREAKDOWN COSTI -->
                <div class="analysis-card">
                    <h3><i class="fas fa-chart-pie"></i> Breakdown Costi</h3>
                    <div id="costBreakdown">
                        <!-- ✅ LISTA DINAMICA -->
                    </div>
                </div>

                <!-- ✅ ALERT E ANOMALIE -->
                <div class="analysis-card">
                    <h3><i class="fas fa-exclamation-triangle"></i> Alert Costi</h3>
                    <div id="costAlerts">
                        <!-- ✅ ALERT DINAMICI -->
                    </div>
                </div>
            </div>
        </section>

    </div>

    <!-- ✅ SCRIPTS -->
    <script type="module" src="../../../core/client/supabase-client.js"></script>
    <script type="module" src="../../../core/services/core-services.js"></script>
    <script type="module" src="./dashboard-v2.js"></script>
    
    <script>
        // ✅ CARICA SERVIZI CORE
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 Loading core services for transport costs dashboard...');
            
            // ✅ CARICA HEADER
            try {
                const headerModule = await import('../../../core/components/header-component.js');
                console.log('✅ Core services loaded for transport costs dashboard');
            } catch (error) {
                console.warn('⚠️ Could not load header component:', error);
            }
        });
    </script>
</body>
</html>
