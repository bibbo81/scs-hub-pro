[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm run build" # o il tuo comando di build

[[redirects]]
  from = "/"
  to = "/tracking.html"
  status = 200

# FIX: Redirect da /netlify/functions a /.netlify/functions (CON PUNTO)
[[redirects]]
  from = "/netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# FIX: Anche /api deve puntare a /.netlify/functions (CON PUNTO)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"
  node_bundler = "nft"

[functions."update-tracking-status"]
  # Esegue alle 7:00 e 13:00 UTC (corrispondenti a 9:00 e 15:00 ora di Roma con ora legale)
  # Formato Cron: minuti ore giorno-del-mese mese giorno-della-settimana
  schedule = "0 7,13 * * *"
