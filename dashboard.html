<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/core/env-check.js"></script>
    <title>Dashboard - SCS Hub Pro</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23007AFF'%3E%3Cpath d='M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm5-18v4h3V3h-3z'/%3E%3C/svg%3E">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Solarium CSS - STESSO stile delle altre pagine -->
    <link rel="stylesheet" href="/assets/css/solarium.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Core Modules - IDENTICI alle altre pagine -->
    <script type="module">
        import api from '/core/api-client.js';
        import headerComponent from '/core/header-component.js';
        import notificationSystem from '/core/notification-system.js';
        import modalSystem from '/core/modal-system.js';
        
        window.api = api;
        window.headerComponent = headerComponent;
        window.NotificationSystem = notificationSystem;
        window.ModalSystem = modalSystem;
    </script>
    
    <!-- Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <!-- Auth System -->
    <script src="/core/auth-supabase.js"></script>
    <script src="/core/auth-init.js"></script>
    
    <style>
        .kpi-card {
            background: white;
            border-radius: var(--sol-radius-lg);
            padding: 1.5rem;
            box-shadow: var(--sol-shadow-sm);
            border: 1px solid var(--sol-gray-200);
            transition: transform var(--sol-transition-fast);
        }
        
        .kpi-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--sol-shadow-md);
        }
        
        .kpi-label {
            font-size: 0.875rem;
            color: var(--sol-gray-600);
            margin-bottom: 0.5rem;
        }
        
        .kpi-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--sol-gray-900);
            margin-bottom: 0.5rem;
        }
        
        .kpi-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--sol-radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .growth-positive { color: var(--sol-success); }
        .growth-negative { color: var(--sol-danger); }
        
        .chart-container {
            background: white;
            border-radius: var(--sol-radius-lg);
            padding: 1.5rem;
            box-shadow: var(--sol-shadow-sm);
            border: 1px solid var(--sol-gray-200);
            margin-bottom: 1.5rem;
        }
        
        .chart-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--sol-gray-800);
        }
    </style>
</head>
<body>
    <!-- Header Component - IDENTICO alle altre pagine -->
    <div id="header-root"></div>

    <!-- Main Content con stesso layout -->
    <main class="sol-main-content" id="mainContent">
        <!-- Page Header -->
        <div class="sol-page-header">
            <div>
                <h1 class="sol-page-title">Dashboard</h1>
                <p class="sol-page-subtitle">Panoramica completa delle tue spedizioni e KPI</p>
            </div>
            <div class="sol-page-actions">
                <button class="sol-btn sol-btn-glass" id="refreshBtn" onclick="dashboard.refresh()">
                    <i class="fas fa-sync-alt"></i>
                    <span>Aggiorna</span>
                </button>
                <button class="sol-btn sol-btn-glass" onclick="dashboard.exportToExcel()">
                    <i class="fas fa-download"></i>
                    <span>Esporta</span>
                </button>
            </div>
        </div>

        <!-- Filters -->
        <div class="sol-card mb-4">
            <div class="sol-card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label">Periodo</label>
                        <select class="form-select" id="periodFilter">
                            <option value="7">Ultimi 7 giorni</option>
                            <option value="30" selected>Ultimi 30 giorni</option>
                            <option value="90">Ultimi 3 mesi</option>
                            <option value="365">Ultimo anno</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Spedizioniere</label>
                        <select class="form-select" id="carrierFilter">
                            <option value="">Tutti gli spedizionieri</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Stato</label>
                        <select class="form-select" id="statusFilter">
                            <option value="">Tutti gli stati</option>
                            <option value="delivered">Consegnato</option>
                            <option value="in_transit">In transito</option>
                            <option value="pending">In attesa</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button class="sol-btn sol-btn-primary w-100" onclick="dashboard.applyFilters()">
                            <i class="fas fa-filter"></i>
                            Applica Filtri
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- KPI Cards -->
        <div class="row g-4 mb-4" id="kpiCards">
            <!-- Popolato dinamicamente -->
        </div>

        <!-- Charts Section -->
        <div class="row g-4">
            <div class="col-xl-8">
                <div class="chart-container">
                    <div class="chart-title">
                        <i class="fas fa-chart-line text-primary me-2"></i>
                        Trend Spedizioni
                    </div>
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
            <div class="col-xl-4">
                <div class="chart-container">
                    <div class="chart-title">
                        <i class="fas fa-chart-pie text-success me-2"></i>
                        Modalità di Trasporto
                    </div>
                    <canvas id="transportModeChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Detail Tables -->
        <div class="sol-card">
            <div class="sol-card-header">
                <h3 class="sol-card-title">Dettaglio Spedizionieri</h3>
            </div>
            <div class="sol-card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Spedizioniere</th>
                                <th class="text-end">Spedizioni</th>
                                <th class="text-end">Fatturato</th>
                                <th class="text-end">Peso (kg)</th>
                                <th class="text-end">Volume (m³)</th>
                                <th class="text-end">Costo Medio</th>
                                <th class="text-end">Performance</th>
                                <th class="text-center">Azioni</th>
                            </tr>
                        </thead>
                        <tbody id="carriersDetailBody">
                            <!-- Popolato dinamicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center bg-white bg-opacity-75 d-none" style="z-index: 9999;">
        <div class="text-center">
            <div class="spinner-border text-primary mb-3" role="status"></div>
            <h5>Caricamento...</h5>
        </div>
    </div>

        <!-- Core Services Module -->
    <script type="module">
        // Inizializza Supabase client globalmente
        if (!window.supabase) {
            const { createClient } = supabase;
            window.supabase = createClient(
                'https://gnlrmnsdmpjzitsysowq.supabase.co',
                'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdubnJtbnNkbXBqeml0c3lzb3dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjk3OTI3OTQsImV4cCI6MjA0NTM2ODc5NH0.nBBLNL4OGHqXcj_0qXUYx95UwjJDcZXuKvQDmjq5B3k'
            );
        }
    
        // Import dei servizi core
        const { default: dataManager } = await import('/core/services/data-manager.js');
        const { default: notificationSystem } = await import('/core/notification-system.js');
        const { default: headerComponent } = await import('/core/header-component.js');
        
        // Rendi disponibili globalmente
        window.dataManager = dataManager;
        window.notificationSystem = notificationSystem;
        window.headerComponent = headerComponent;
        
        console.log('✅ Core services loaded for dashboard page');
    </script>
    
    <!-- Dashboard Script -->
    <script type="module" src="/pages/dashboard/index.js"></script>
</body>
</html>
